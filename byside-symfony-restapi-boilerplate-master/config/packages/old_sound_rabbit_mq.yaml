    default:
      host: "%env(resolve:RABBITMQ_HOST)%"
      port: "%env(resolve:RABBITMQ_PORT)%"
      user: "%env(resolve:RABBITMQ_USER)%"
      password: "%env(resolve:RABBITMQ_PASSWORD)%"
      vhost: "%env(resolve:RABBITMQ_PROJECT_VHOST)%"
      connection_timeout: 10
