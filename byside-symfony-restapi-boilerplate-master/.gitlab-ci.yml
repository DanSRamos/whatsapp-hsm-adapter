.rollback: &rollback
  stage: rollback
  tags:
    - docker-shell
  script:
    - *get-configs
    - ploy/docker-rollback
      --machines "$MACHINES"
      --file docker-compose-deploy.yml
      --env-file .env
      --folder "/app/$PROJECT_NAME"
  only:
    - tags
  when: manual

Rollback WE1-Docker:
  environment:
    name: WE1
  variables:
    MACHINES: "$BOILERPLATE_WE1_MACHINES"
  <<: *rollback


.export-image-version: &export-image-version
  - export IMAGE_VERSION=$([ -n "$CI_COMMIT_TAG" ] && echo $CI_COMMIT_TAG || echo $CI_COMMIT_REF_SLUG)

.copy-configs: &copy-configs
  - rm -rf webcare-configs
  - cp -a webcare-configs/${WEBCARE_CONFIGS_PROJECT_FOLDER} ${WEBCARE_CONFIGS_PROJECT_FOLDER}-configs

