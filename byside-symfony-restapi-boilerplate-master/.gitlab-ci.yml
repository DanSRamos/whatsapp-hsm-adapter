variables:
  PROJECT_NAME: "boilerplate"
  CORRECT_CI_PROJECT_NAME: "boilerplate"
  PROJECT_PATH: "/var/byside-symfony-restapi-boilerplate"
  PROJECT_PATH_CACHE: "/var/cache/byside-symfony-restapi-boilerplate"
  PROJECT_PATH_LOG: "/var/log/byside-symfony-restapi-boilerplate"
  WEBCARE_CONFIGS_PROJECT_FOLDER: "boilerplate"
  ROLLBACK: ''
  PLOY_VERSION: 2.0.0
  CONFIGS_VERSION: master # or tag
  BOILERPLATE_DEV1_MACHINES: "php01.dev1.byside-nos.local"
  BOILERPLATE_PRE1_MACHINES: "php01.pre1.byside-nos.local"
  BOILERPLATE_WE1_MACHINES: "php01.we1.byside-nos.local"
  DEPLOY_PATH: "/var/webcare${CI_ENVIRONMENT_NAME}_source/${CI_PROJECT_NAME}"

default:
  tags:
    - docker-shell-aws

before_script:
  - git clone -c advice.detachedHead=false --depth 1 --branch $PLOY_VERSION http://gitlab-ci-token:${CI_JOB_TOKEN}@git.byside-nos.local/devops/ploy.git
  - ploy/docker-login-ci
  - ploy/docker-login-ci-aws-ecr
  - eval $(ssh-agent -s | tee /tmp/${CI_JOB_ID}-ssh-agent.env)
  - echo "$SSH_PRIVATE_KEY_GITLAB_RUNNER" | tr -d '\r' | ssh-add -

after_script:
  - . /tmp/${CI_JOB_ID}-ssh-agent.env
  - kill $SSH_AGENT_PID
  - rm /tmp/${CI_JOB_ID}-ssh-agent.env

# Define pipeline stages
stages:
  - deploy-feature
  - syntax
  - tests
  - deploy-releaseBranch
  - build-images
  - deploy
  - rollback

PHP CS Fixer:
  stage: syntax
  script:
    - bin/docker-compose-run-ci.sh php-cs-fixer
  except:
    - /^hotfix.*$/

Lint:
  stage: syntax
  script:
    - bin/docker-compose-run-ci.sh lint
  except:
    - /^hotfix.*$/


PHPSTAN:
  stage: syntax
  needs: []
  allow_failure: true
  script:
    - bin/docker-compose-run-ci.sh phpstan
  except:
    - /^hotfix.*$/
    - tags
    - master

Unit Tests with Coverage:
  stage: tests
  coverage: '/^\s*Lines:\s*\d+.\d+\%/'
  artifacts:
    name: "PHPUnit Coverage"
    paths:
      - build/
  script:
    - mkdir -p build/coverage
    - bin/docker-compose-run-ci.sh unit-tests-coverage --process-isolation

.build-images: &build-images
  - ploy/docker-buildx-create
  - bin/docker-build-ci.sh -t $CI_REGISTRY_IMAGE:$IMAGE_VERSION --target prod .
  # - bin/docker-build-ci.sh -t $CI_REGISTRY_IMAGE/issue-print:$IMAGE_VERSION --target issue_print .

.deploy-image: &deploy-image
  - ploy/docker-deploy
    --machines "$MACHINES"
    --file docker-compose-deploy.yml
    --version "$IMAGE_VERSION"
    --env-file .env
    --folder "/app/$PROJECT_NAME"

.get-configs: &get-configs
  - echo 'Copy configs...'
  - git clone -c advice.detachedHead=false --depth 1 --branch $CONFIGS_VERSION http://gitlab-ci-token:${CI_JOB_TOKEN}@git.byside-nos.local/security/webcare-configs.git
  - cp -f webcare-configs/${WEBCARE_CONFIGS_PROJECT_FOLDER}/${CI_ENVIRONMENT_NAME}/.env .env
  - rm -rf webcare-configs

.deploy-docker: &deploy-docker
  - *build-images
  - *get-configs
  - *deploy-image

.write-version: &write-version
  - ssh -tt gitlab-runner@container01.byside-nos.local "sudo echo "${CI_COMMIT_BRANCH},${CI_COMMIT_SHORT_SHA},$(date '+%Y-%m-%d %H:%M:%S')" > /opt/atlas-ui-container/src/projects_version/${ATLAS_PATH_AUX}${CORRECT_CI_PROJECT_NAME}.txt"


