.zone-variable: &zone-variable
  - LOWERCASE_ENVIRONMENT=$(echo "${CI_ENVIRONMENT_NAME}" | tr '[:upper:]' '[:lower:]')
  - export ZONE=$LOWERCASE_ENVIRONMENT

.deploy-aws: &deploy-aws
  - *zone-variable
  - *export-image-version
  - ploy/aws-blue-green-deploy
    --application $PROJECT_NAME
    --file docker-compose-deploy-aws.yml
    --version "${IMAGE_VERSION}"
    --zone "${ZONE}"

